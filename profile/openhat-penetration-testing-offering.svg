  <text x="48" y="328" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#f8f8f0" opacity=".78">For $1,000 we find a High or Critical vulnerability in your software.</text>
  <text x="48" y="352" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#f8f8f0" opacity=".78">If we don't — you don't pay. Written authorization required.</text>

